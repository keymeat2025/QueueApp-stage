<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today's Menu - QueueApp</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif;
  background: linear-gradient(180deg, #000000 0%, #1c1c1e 50%, #2c2c2e 100%);
  min-height: 100vh;
  overflow-x: hidden;
  color: white;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Header */
.header {
  background: rgba(28, 28, 30, 0.8);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  padding: 16px 20px;
  text-align: center;
  border-bottom: 0.5px solid rgba(255,255,255,0.1);
  position: sticky;
  top: 0;
  z-index: 100;
}

.live-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(255,59,48,0.15);
  border: 1px solid rgba(255,59,48,0.3);
  padding: 4px 12px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 12px;
  animation: fadeIn 0.5s ease;
  letter-spacing: 0.3px;
}

.live-dot {
  width: 8px;
  height: 8px;
  background: #ff3b30;
  border-radius: 50%;
  box-shadow: 0 0 8px rgba(255,59,48,0.6);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.7; transform: scale(1.15); }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

.menu-title {
  font-size: 28px;
  color: #ffffff;
  margin: 8px 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-weight: 700;
  letter-spacing: -0.5px;
  animation: fadeIn 0.7s ease 0.2s both;
}

.menu-subtitle {
  color: rgba(255,255,255,0.6);
  font-size: 14px;
  margin-top: 4px;
  font-weight: 400;
  letter-spacing: 0.2px;
  animation: fadeIn 0.7s ease 0.4s both;
}

/* Carousel Container */
.carousel-container {
  max-width: 1200px;
  margin: 50px auto 40px;
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.carousel-wrapper {
  perspective: 2000px;
  width: 100%;
  max-width: 420px;
  height: 580px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 30px;
}

.carousel-stack {
  position: relative;
  width: 100%;
  height: 100%;
}

/* Menu Cards */
.menu-card {
  position: absolute;
  width: 100%;
  height: 100%;
  background: rgba(28, 28, 30, 0.7);
  backdrop-filter: saturate(180%) blur(30px);
  -webkit-backdrop-filter: saturate(180%) blur(30px);
  border-radius: 24px;
  padding: 32px 24px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 0.5px rgba(255,255,255,0.1);
  border: 0.5px solid rgba(255,255,255,0.15);
  transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
  overflow-y: auto;
  overflow-x: hidden;
}

.menu-card::-webkit-scrollbar {
  width: 4px;
}

.menu-card::-webkit-scrollbar-track {
  background: rgba(255,255,255,0.05);
  border-radius: 10px;
}

.menu-card::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.2);
  border-radius: 10px;
}

.menu-card::-webkit-scrollbar-thumb:hover {
  background: rgba(255,255,255,0.3);
}

/* Card States */
.menu-card.active {
  transform: translateX(0) translateY(0) scale(1) rotateY(0deg);
  opacity: 1;
  z-index: 10;
  filter: brightness(1);
}

.menu-card.next {
  transform: translateX(60px) translateY(25px) scale(0.92) rotateY(-12deg);
  opacity: 0.4;
  z-index: 9;
  filter: brightness(0.7);
  pointer-events: none;
}

.menu-card.prev {
  transform: translateX(-60px) translateY(25px) scale(0.92) rotateY(12deg);
  opacity: 0.4;
  z-index: 8;
  filter: brightness(0.7);
  pointer-events: none;
}

.menu-card.hidden {
  transform: translateY(150px) scale(0.7);
  opacity: 0;
  z-index: 1;
  pointer-events: none;
}

/* Card Content */
.category-header {
  text-align: center;
  margin-bottom: 28px;
  padding-bottom: 20px;
  border-bottom: 0.5px solid rgba(255,255,255,0.1);
}

.category-badge {
  display: inline-block;
  padding: 6px 14px;
  background: rgba(255,255,255,0.1);
  border: 0.5px solid rgba(255,255,255,0.15);
  border-radius: 12px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  margin-bottom: 14px;
  animation: fadeIn 0.6s ease;
}

.special-badge {
  animation: glow 2s ease-in-out infinite;
}

@keyframes glow {
  0%, 100% { box-shadow: 0 0 8px currentColor; }
  50% { box-shadow: 0 0 16px currentColor, 0 0 24px currentColor; }
}

.category-icon {
  font-size: 52px;
  margin-bottom: 16px;
  animation: fadeIn 0.8s ease;
  filter: drop-shadow(0px 2px 8px rgba(0,0,0,0.3));
}

.category-title {
  color: white;
  font-size: 32px;
  font-weight: 700;
  margin-bottom: 10px;
  letter-spacing: -0.5px;
  line-height: 1.2;
  animation: fadeIn 1s ease;
}

.category-tagline {
  color: rgba(255,255,255,0.7);
  font-size: 14px;
  font-weight: 400;
  line-height: 1.4;
  max-width: 90%;
  margin: 0 auto;
  animation: fadeIn 1.2s ease;
  letter-spacing: 0.1px;
}

/* Menu Items */
.menu-items {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.menu-item {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  padding: 16px 18px;
  border-radius: 14px;
  border: 0.5px solid rgba(255,255,255,0.1);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
}

.menu-item:hover {
  background: rgba(255,255,255,0.12);
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}

.item-header {
  display: flex;
  justify-content: space-between;
  align-items: start;
  margin-bottom: 8px;
  gap: 14px;
}

.item-name-wrapper {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
}

.item-name {
  font-size: 16px;
  font-weight: 600;
  color: white;
  line-height: 1.3;
  flex: 1;
  letter-spacing: -0.2px;
}

.item-badge {
  font-size: 14px;
  flex-shrink: 0;
}

.item-price {
  color: rgba(255,255,255,0.95);
  font-size: 16px;
  font-weight: 700;
  white-space: nowrap;
  background: rgba(255,255,255,0.1);
  padding: 4px 12px;
  border-radius: 8px;
  border: 0.5px solid rgba(255,255,255,0.15);
  letter-spacing: 0.2px;
}

.item-description {
  color: rgba(255,255,255,0.6);
  font-size: 13px;
  line-height: 1.4;
  margin-top: 6px;
  letter-spacing: 0.1px;
}

/* Navigation Controls */
.carousel-controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  margin-bottom: 24px;
}

.carousel-btn {
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  border: 0.5px solid rgba(255,255,255,0.2);
  color: white;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  font-size: 24px;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 300;
  user-select: none;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}

.carousel-btn:hover {
  background: rgba(255,255,255,0.18);
  transform: scale(1.08);
  box-shadow: 0 6px 24px rgba(0,0,0,0.3);
}

.carousel-btn:active {
  transform: scale(0.96);
  background: rgba(255,255,255,0.25);
}

/* Indicators */
.carousel-indicators {
  display: flex;
  gap: 8px;
  justify-content: center;
}

.indicator {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,0.3);
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  border: none;
}

.indicator.active {
  background: white;
  width: 24px;
  border-radius: 4px;
  box-shadow: 0 2px 8px rgba(255,255,255,0.3);
}

.indicator:hover:not(.active) {
  background: rgba(255,255,255,0.5);
  transform: scale(1.3);
}

/* Empty State */
.empty-state {
  text-align: center;
  padding: 100px 20px;
  animation: fadeIn 0.8s ease;
}

.empty-icon {
  font-size: 100px;
  margin-bottom: 25px;
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-15px); }
}

.empty-title {
  font-size: 32px;
  color: #cbd5e0;
  margin-bottom: 18px;
  font-weight: 700;
}

.empty-text {
  color: #718096;
  font-size: 17px;
  max-width: 450px;
  margin: 0 auto;
  line-height: 1.6;
}

/* Loading Animation */
.loading {
  text-align: center;
  padding: 120px 20px;
}

.loading-spinner {
  width: 70px;
  height: 70px;
  border: 6px solid rgba(255,153,102,0.2);
  border-top-color: #ff9966;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 25px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.loading-text {
  color: #cbd5e0;
  font-size: 20px;
  font-weight: 600;
}

/* Mobile Responsiveness */
@media (max-width: 768px) {
  .menu-title {
    font-size: 24px;
    gap: 8px;
  }
  
  .menu-subtitle {
    font-size: 13px;
  }
  
  .carousel-wrapper {
    max-width: 100%;
    height: 520px;
    margin-bottom: 24px;
  }
  
  .menu-card {
    padding: 28px 20px;
    border-radius: 20px;
  }
  
  .category-icon {
    font-size: 44px;
  }
  
  .category-title {
    font-size: 26px;
  }
  
  .category-tagline {
    font-size: 13px;
  }
  
  .item-name {
    font-size: 15px;
  }
  
  .item-price {
    font-size: 15px;
  }
  
  .carousel-btn {
    width: 50px;
    height: 50px;
    font-size: 22px;
  }
}

@media (max-width: 480px) {
  .header {
    padding: 14px 16px;
  }
  
  .menu-title {
    font-size: 22px;
    flex-direction: row;
    gap: 8px;
  }
  
  .menu-subtitle {
    font-size: 12px;
  }
  
  .carousel-wrapper {
    height: 480px;
  }
  
  .menu-card {
    padding: 24px 18px;
    border-radius: 18px;
  }
  
  .category-icon {
    font-size: 40px;
  }
  
  .category-title {
    font-size: 24px;
  }
  
  .category-badge {
    font-size: 9px;
    padding: 5px 12px;
    letter-spacing: 1px;
  }
  
  .item-name {
    font-size: 14px;
  }
  
  .item-price {
    font-size: 14px;
    padding: 4px 10px;
  }
  
  .carousel-btn {
    width: 46px;
    height: 46px;
    font-size: 20px;
  }
  
  .carousel-controls {
    gap: 16px;
  }
}

/* Special Category Styles */
.card-daily-special {
  background: linear-gradient(135deg, 
              rgba(240,147,251,0.25), 
              rgba(245,87,108,0.25)),
              rgba(28, 28, 30, 0.7);
  backdrop-filter: saturate(180%) blur(30px);
}

.card-chef-special {
  background: linear-gradient(135deg, 
              rgba(250,112,154,0.25), 
              rgba(254,225,64,0.25)),
              rgba(28, 28, 30, 0.7);
  backdrop-filter: saturate(180%) blur(30px);
}

.card-weekly-special {
  background: linear-gradient(135deg, 
              rgba(255,236,210,0.25), 
              rgba(252,182,159,0.25)),
              rgba(28, 28, 30, 0.7);
  backdrop-filter: saturate(180%) blur(30px);
}

.card-regular {
  background: linear-gradient(135deg, 
              var(--gradient-start), 
              var(--gradient-end)),
              rgba(28, 28, 30, 0.7);
  background-blend-mode: overlay;
  backdrop-filter: saturate(180%) blur(30px);
}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="live-badge">
    <div class="live-dot"></div>
    <span>Live</span>
  </div>
  <h1 class="menu-title">
    <span>🍽️</span>
    <span>Today's Menu</span>
  </h1>
  <p class="menu-subtitle">Browse our delicious offerings</p>
</div>

<!-- Main Content -->
<div id="mainContent"></div>

<script>
let menuData = null;
let currentIndex = 0;
let allCategories = [];

// Load menu data on page load
window.addEventListener('DOMContentLoaded', () => {
  loadMenuData();
});

function loadMenuData() {
  const mainContent = document.getElementById('mainContent');
  
  // Show loading state
  mainContent.innerHTML = `
    <div class="loading">
      <div class="loading-spinner"></div>
      <p class="loading-text">Loading menu...</p>
    </div>
  `;
  
  // Debug: Check localStorage
  console.log('🔍 Checking localStorage...');
  console.log('📍 Current URL:', window.location.href);
  console.log('🌐 Origin:', window.location.origin);
  
  // Get menu from localStorage
  const menuJSON = localStorage.getItem('restaurantMenu');
  const lastUpdated = localStorage.getItem('menuLastUpdated');
  
  console.log('📦 localStorage keys:', Object.keys(localStorage));
  console.log('🍽️ restaurantMenu exists:', !!menuJSON);
  console.log('📅 Last updated:', lastUpdated);
  
  if (menuJSON) {
    console.log('📊 Menu data size:', menuJSON.length, 'characters');
  }
  
  if (!menuJSON) {
    console.error('❌ No menu data found in localStorage');
    console.log('💡 Make sure you opened this file from the same location as admin panel');
    console.log('💡 Check: Are both files in the same folder?');
    console.log('💡 Check: Did you open admin from file:// or http://localhost?');
    showEmptyState();
    return;
  }
  
  try {
    menuData = JSON.parse(menuJSON);
    console.log('✅ Menu parsed successfully');
    console.log('📊 Categories found:', {
      special: menuData.specialCategories?.length || 0,
      regular: menuData.regularCategories?.length || 0
    });
    
    // Check for expired specials
    checkExpiredSpecials();
    
    // Combine special and regular categories in priority order
    allCategories = [];
    
    if (menuData.specialCategories) {
      allCategories.push(...menuData.specialCategories.sort((a, b) => a.priority - b.priority));
    }
    
    if (menuData.regularCategories) {
      allCategories.push(...menuData.regularCategories.sort((a, b) => a.priority - b.priority));
    }
    
    console.log('📋 Total categories to display:', allCategories.length);
    
    if (allCategories.length === 0) {
      console.warn('⚠️ No categories found after processing');
      showEmptyState();
      return;
    }
    
    renderCarousel();
  } catch (error) {
    console.error('❌ Error loading menu:', error);
    console.error('Menu JSON:', menuJSON?.substring(0, 200) + '...');
    showEmptyState();
  }
}

function checkExpiredSpecials() {
  if (!menuData.specialCategories) return;
  
  const now = new Date();
  menuData.specialCategories = menuData.specialCategories.filter(cat => {
    if (cat.validUntil) {
      const expiry = new Date(cat.validUntil);
      return now < expiry;
    }
    return true;
  });
}

function showEmptyState() {
  const mainContent = document.getElementById('mainContent');
  
  // Check if localStorage is accessible
  const isLocalStorageAvailable = typeof(Storage) !== "undefined";
  const hasMenuData = !!localStorage.getItem('restaurantMenu');
  
  let debugInfo = '';
  if (!isLocalStorageAvailable) {
    debugInfo = `
      <div style="background: rgba(255,255,0,0.1); border: 2px solid #ffc107; border-radius: 10px; padding: 20px; margin-top: 20px; max-width: 500px; margin-left: auto; margin-right: auto;">
        <h3 style="color: #ffc107; margin-bottom: 10px;">⚠️ localStorage Not Available</h3>
        <p style="color: #cbd5e0; font-size: 14px; line-height: 1.6;">
          Your browser doesn't support localStorage or it's disabled.
          <br><br>
          <strong>Solutions:</strong><br>
          • Enable cookies in browser settings<br>
          • Exit incognito/private mode<br>
          • Try a different browser
        </p>
      </div>
    `;
  } else if (!hasMenuData) {
    debugInfo = `
      <div style="background: rgba(33,150,243,0.1); border: 2px solid #2196F3; border-radius: 10px; padding: 20px; margin-top: 20px; max-width: 500px; margin-left: auto; margin-right: auto;">
        <h3 style="color: #2196F3; margin-bottom: 10px;">🔍 Troubleshooting</h3>
        <p style="color: #cbd5e0; font-size: 14px; line-height: 1.6;">
          No menu data found in localStorage.
          <br><br>
          <strong>Checklist:</strong><br>
          ✓ Did you upload and process menu in admin panel?<br>
          ✓ Did you click "Save & Preview"?<br>
          ✓ Are both HTML files in the same folder?<br>
          ✓ Did you open both from the same location (file:// or http://)?<br>
          <br>
          <strong>Quick Fix:</strong><br>
          1. Go back to admin panel<br>
          2. Click "Save & Preview" again<br>
          3. Or press F5 to refresh this page
        </p>
        <button onclick="location.reload()" style="background: #2196F3; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 15px;">
          🔄 Refresh Page
        </button>
      </div>
    `;
  }
  
  mainContent.innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">📋</div>
      <h2 class="empty-title">No Menu Available</h2>
      <p class="empty-text">
        The restaurant menu hasn't been uploaded yet. 
        Please check back soon or contact the staff.
      </p>
      ${debugInfo}
    </div>
  `;
}

function renderCarousel() {
  const mainContent = document.getElementById('mainContent');
  
  mainContent.innerHTML = `
    <div class="carousel-container">
      <div class="carousel-wrapper">
        <div class="carousel-stack" id="carouselStack">
          ${allCategories.map((cat, index) => createMenuCard(cat, index)).join('')}
        </div>
      </div>
      
      <div class="carousel-controls">
        <button class="carousel-btn" onclick="previousSlide()" aria-label="Previous">‹</button>
        <button class="carousel-btn" onclick="nextSlide()" aria-label="Next">›</button>
      </div>
      
      <div class="carousel-indicators">
        ${allCategories.map((_, index) => 
          `<div class="indicator ${index === 0 ? 'active' : ''}" onclick="goToSlide(${index})" aria-label="Go to slide ${index + 1}"></div>`
        ).join('')}
      </div>
    </div>
  `;
  
  updateCardPositions();
}

function createMenuCard(category, index) {
  const isSpecial = category.type ? true : false;
  const cardClass = isSpecial ? `card-${category.type}-special` : 'card-regular';
  
  const accentColor = isSpecial ? 
    (category.type === 'daily' ? '#f5576c' : 
     category.type === 'chef' ? '#fee140' : '#fcb69f') : 
    category.gradientStart || '#ff9966';
  
  const badgeText = category.badge || category.name;
  const badgeClass = isSpecial ? 'category-badge special-badge' : 'category-badge';
  
  return `
    <div class="menu-card ${cardClass}" 
         data-index="${index}"
         style="--gradient-start: ${category.gradientStart}; --gradient-end: ${category.gradientEnd}; color: ${accentColor};">
      <div class="category-header">
        <div class="${badgeClass}" style="color: ${accentColor};">${badgeText}</div>
        <div class="category-icon">${category.icon}</div>
        <h2 class="category-title">${category.name}</h2>
        ${category.tagline ? `<p class="category-tagline">${category.tagline}</p>` : ''}
      </div>
      
      <div class="menu-items">
        ${category.items && category.items.length > 0 ? 
          category.items.map(item => createMenuItem(item, accentColor)).join('') :
          '<p style="text-align:center; color: rgba(255,255,255,0.6); padding: 40px 20px; font-size: 16px;">Add items to this special menu from the admin panel</p>'
        }
      </div>
    </div>
  `;
}

function createMenuItem(item, accentColor) {
  const badges = [];
  if (item.isPopular) badges.push('<span class="item-badge" title="Popular">⭐</span>');
  if (item.isNew) badges.push('<span class="item-badge" title="New">🆕</span>');
  
  return `
    <div class="menu-item" style="border-color: ${accentColor};">
      <div class="item-header">
        <div class="item-name-wrapper">
          <div class="item-name">${item.name}</div>
          ${badges.join('')}
        </div>
        ${item.price ? `<div class="item-price" style="color: ${accentColor}; border-color: ${accentColor};">${item.price}</div>` : ''}
      </div>
      ${item.description ? `<div class="item-description">${item.description}</div>` : ''}
    </div>
  `;
}

function updateCardPositions() {
  const cards = document.querySelectorAll('.menu-card');
  const indicators = document.querySelectorAll('.indicator');
  const totalCards = cards.length;
  
  cards.forEach((card, index) => {
    card.classList.remove('active', 'next', 'prev', 'hidden');
    
    if (index === currentIndex) {
      card.classList.add('active');
    } else if (index === (currentIndex + 1) % totalCards) {
      card.classList.add('next');
    } else if (index === (currentIndex - 1 + totalCards) % totalCards) {
      card.classList.add('prev');
    } else {
      card.classList.add('hidden');
    }
  });
  
  indicators.forEach((indicator, index) => {
    indicator.classList.toggle('active', index === currentIndex);
  });
}

function nextSlide() {
  currentIndex = (currentIndex + 1) % allCategories.length;
  updateCardPositions();
}

function previousSlide() {
  currentIndex = (currentIndex - 1 + allCategories.length) % allCategories.length;
  updateCardPositions();
}

function goToSlide(index) {
  currentIndex = index;
  updateCardPositions();
}

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') previousSlide();
  if (e.key === 'ArrowRight') nextSlide();
});

// Touch swipe support
let touchStartX = 0;
let touchEndX = 0;

document.addEventListener('touchstart', (e) => {
  touchStartX = e.changedTouches[0].screenX;
}, { passive: true });

document.addEventListener('touchend', (e) => {
  touchEndX = e.changedTouches[0].screenX;
  handleSwipe();
}, { passive: true });

function handleSwipe() {
  const swipeThreshold = 50;
  const diff = touchStartX - touchEndX;
  
  if (Math.abs(diff) > swipeThreshold) {
    if (diff > 0) {
      nextSlide();
    } else {
      previousSlide();
    }
  }
}
